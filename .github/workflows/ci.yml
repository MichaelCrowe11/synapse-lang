name: Runtime verification

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime and verification dependencies
        run: python -m pip install ".[jit]" pytest pytest-cov pyyaml build twine ruff
      - name: Full supported-feature gate with strict roadmap expectations
        run: python -m pytest tests/ -o addopts='' -q --junitxml=test-results.xml
      - name: Quantum Net source tests (grammar, scheduler, roadmap and protocol-stub contracts)
        run: python -m pytest quantum-net/tests -o addopts='' -q
      - name: Lint new runtime verification and isolation modules
        run: python -m ruff check tests/test_runtime_optimization.py tests/test_scientific_invariants.py tests/test_isolation.py synapse_lang/benchmark.py synapse_lang/isolation.py synapse_lang/_container_worker.py benchmarks/runtime.py benchmarks/paired.py scripts/wheel_smoke.py scripts/verify_installed.py scripts/prepare_matrix.py scripts/report_verification.py tests/test_release_workflow.py
      - name: Build wheel and source distribution
        run: python -m build --outdir release-dist
      - name: Validate distribution metadata
        run: python -m twine check release-dist/*
      - name: Installed-wheel checks without optional dependencies
        run: python scripts/verify_installed.py
      - name: Companion distributions and cross-runtime fault gate
        run: python scripts/verify_trinity_installed.py
      - name: Upload companion verification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trinity-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            benchmarks/trinity-implementation/installed.json
            benchmarks/trinity-implementation/fault-injection.json
            benchmarks/trinity-implementation/installed-*/commands.log
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python-version }}
          path: test-results.xml

  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . pytest build
      - run: python -m build --wheel --outdir release-dist
      - run: docker build -f isolation/Dockerfile -t synapse-isolation:test release-dist
      - name: External boundary and resource tests
        run: |
          export SYNAPSE_TEST_IMAGE=$(docker image inspect synapse-isolation:test --format '{{.Id}}')
          python -m pytest tests/test_isolation.py -o addopts='' -q

  legacy_static_analysis:
    # SL-Q01: visible diagnostic, not a claim that the legacy package is lint-clean.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff mypy
      - name: Capture legacy lint and typing reports
        run: |
          python -m ruff check synapse_lang/ > legacy-lint.txt 2>&1 || true
          python -m mypy synapse_lang/ > legacy-types.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-static-analysis
          path: legacy-*.txt
