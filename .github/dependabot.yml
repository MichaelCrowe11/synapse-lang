version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      pip-security:
        applies-to: security-updates
        patterns:
          - "*"
      pip-patch-and-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/vscode-extension"
    schedule:
      interval: "weekly"
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      npm-patch-and-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
